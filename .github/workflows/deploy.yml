name: Deploy to Oracle VM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Make package public
        continue-on-error: true
        run: |
          gh api -X PATCH /users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/visibility \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"

            echo "=== Environment ==="
            docker --version

            cd "$HOME/telegram-order-bot"

            # ── Pull latest code (for compose file changes) ──
            git fetch origin main
            git reset --hard origin/main
            echo "Pulled: $(git log --oneline -1)"

            # ── Shared Docker network ──
            docker network inspect shared >/dev/null 2>&1 || docker network create shared

            # ── .env (create if missing) ──
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "EDIT .env on the VM to fill in secrets"
            fi

            # ── Pull latest image and restart ──
            timeout 30 docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml pull bot
            docker compose -f docker-compose.prod.yml up -d

            # ── Reload edge nginx ──
            NGINX_RUNNING=0
            docker compose -f "$HOME/server-stuff/docker-compose.yml" ps --status running nginx 2>/dev/null | grep -q "nginx" && NGINX_RUNNING=1 || true
            if [ "$NGINX_RUNNING" = "1" ]; then
              docker compose -f "$HOME/server-stuff/docker-compose.yml" exec -T nginx nginx -s reload \
                && echo "edge nginx reloaded" \
                || echo "WARN: nginx reload failed"
            else
              echo "WARN: edge nginx container not running, skipping reload"
            fi

            # ── Wait for bot health ──
            echo "Waiting for bot to become healthy..."
            i=0
            while [ "$i" -lt 30 ]; do
              i=$((i + 1))
              HEALTHY=0
              docker compose -f docker-compose.prod.yml ps bot | grep -q healthy && HEALTHY=1 || true
              if [ "$HEALTHY" = "1" ]; then
                echo "Bot is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # ── Cleanup ──
            docker image prune -f

            # ── Summary ──
            echo ""
            echo "=== Deployment Complete ==="
            docker compose -f docker-compose.prod.yml ps
            echo ""
            free -h
