name: Deploy to Oracle VM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"

            echo "=== Environment ==="
            docker --version
            git --version

            # ── Clone or pull latest code ──
            REPO_EXISTS=no
            { [ -d "$HOME/telegram-order-bot/.git" ] && REPO_EXISTS=yes; } || true
            if [ "$REPO_EXISTS" = "yes" ]; then
              echo "Existing repo found, pulling latest..."
              cd "$HOME/telegram-order-bot"
              git fetch origin main
              git reset --hard origin/main
              echo "Pulled latest: $(git log --oneline -1)"
            else
              echo "Cloning repository..."
              rm -rf "$HOME/telegram-order-bot"
              git clone https://github.com/${{ github.repository }}.git "$HOME/telegram-order-bot"
              cd "$HOME/telegram-order-bot"
              echo "Cloned repository: $(git log --oneline -1)"
            fi

            # ── Shared Docker network (so fyp's nginx can reach coffee-bot) ──
            docker network inspect shared >/dev/null 2>&1 || docker network create shared

            # ── .env (create if missing, never overwrite secrets) ──
            ENV_EXISTS=no
            { [ -f .env ] && ENV_EXISTS=yes; } || true
            if [ "$ENV_EXISTS" = "no" ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
              echo "EDIT .env on the VM to fill in TELEGRAM_TOKEN, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SESSION_SECRET, STAFF_CHAT_ID, WEBHOOK_*"
            fi

            # ── Build and start the bot ──
            echo "Building and starting the coffee order bot..."
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d --build

            # ── Reload the shared edge proxy (~/server-stuff) ──
            # nginx was decoupled from fyp's compose into its own stack at
            # ~/server-stuff. Reload it so it picks up the new server block
            # and can reach the freshly-started coffee-bot container.
            docker compose -f "$HOME/server-stuff/docker-compose.yml" exec -T nginx nginx -s reload \
              && echo "edge nginx reloaded" \
              || echo "WARN: could not reload edge nginx"

            # ── Wait for bot health ──
            echo "Waiting for bot to become healthy..."
            i=0
            while [ "$i" -lt 30 ]; do
              i=$((i + 1))
              HEALTHY=0
              docker compose -f docker-compose.prod.yml ps bot | grep -q healthy && HEALTHY=1 || true
              if [ "$HEALTHY" = "1" ]; then
                echo "Bot is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # ── Cleanup ──
            docker image prune -f

            # ── Summary ──
            echo ""
            echo "=== Deployment Complete ==="
            docker compose -f docker-compose.prod.yml ps
            echo ""
            free -h